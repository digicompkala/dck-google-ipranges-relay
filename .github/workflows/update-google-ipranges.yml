name: Update Google IP ranges relay

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_google_ipranges.py"
      - ".github/workflows/update-google-ipranges.yml"

permissions:
  contents: write

concurrency:
  group: google-ipranges-relay-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and validate official Google ranges
        run: python scripts/update_google_ipranges.py

      - name: Validate generated relay
        run: |
          python - <<'PY'
          import ipaddress
          import json
          from pathlib import Path

          expected = {
              "common-crawlers",
              "special-crawlers",
              "user-triggered-fetchers-google",
              "user-triggered-agents",
          }

          aggregate = Path("dist/google-ipranges.json")
          if not aggregate.is_file():
              raise SystemExit("aggregate relay output missing")

          data = json.loads(aggregate.read_text(encoding="utf-8"))
          ranges = data.get("ranges", [])
          counts = data.get("counts", {})
          sources = data.get("sources", {})

          if set(sources) != expected:
              raise SystemExit(f"unexpected aggregate sources: {sorted(sources)}")
          if not isinstance(ranges, list) or not ranges:
              raise SystemExit("empty aggregate ranges")
          if int(counts.get("unique_cidrs", 0)) < 10:
              raise SystemExit("unique CIDR count unexpectedly low")

          for name in expected:
              p = Path(f"dist/{name}.json")
              if not p.is_file():
                  raise SystemExit(f"source relay missing: {p}")
              source_doc = json.loads(p.read_text(encoding="utf-8"))
              prefixes = source_doc.get("prefixes")
              if not isinstance(prefixes, list) or not prefixes:
                  raise SystemExit(f"invalid prefixes in {p}")
              for row in prefixes:
                  if not isinstance(row, dict):
                      raise SystemExit(f"invalid prefix row in {p}")
                  values = [row.get("ipv4Prefix"), row.get("ipv6Prefix")]
                  values = [v for v in values if v]
                  if not values:
                      raise SystemExit(f"empty prefix row in {p}")
                  for cidr in values:
                      ipaddress.ip_network(cidr, strict=False)

          print(
              "VALIDATION=OK",
              f"SOURCE_ENTRIES={counts.get('source_entries')}",
              f"UNIQUE_CIDRS={counts.get('unique_cidrs')}",
          )
          PY

      - name: Commit relay only when changed
        run: |
          if [ -z "$(git status --porcelain -- dist/)" ]; then
            echo "RELAY_CHANGE=NO"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "Update official Google IP ranges"
          git push
